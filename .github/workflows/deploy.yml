name: Deploy

# Manual only: restarting the server kicks everyone out.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to deploy (e.g. v1.3)
        required: true

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    env:
      UT: /opt/ut99-server
      HOST: ${{ secrets.SERVER_HOST }}   # Tailscale name of the server
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download release
        run: |
          gh release download "${{ inputs.release }}" -R "$GITHUB_REPOSITORY" -p 'AutoReady.u*'
          md5sum -c AutoReady.u.md5

      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Install on server
        run: |
          MD5=$(cut -d' ' -f1 AutoReady.u.md5)
          scp AutoReady.u "ubuntu@$HOST:/tmp/AutoReady.u"
          ssh "ubuntu@$HOST" bash -s <<SH
          set -euo pipefail
          echo "$MD5  /tmp/AutoReady.u" | md5sum -c
          sudo systemctl stop ut99-server
          cp -p $UT/System/AutoReady.u $UT/System/AutoReady.u.prev 2>/dev/null || true
          cp /tmp/AutoReady.u $UT/System/AutoReady.u
          echo "$MD5  $UT/System/AutoReady.u" | md5sum -c
          sudo systemctl start ut99-server
          sleep 15
          journalctl -u ut99-server.service --since "1 min ago" | grep -E "active - MinReady" || { echo "AutoReady startup line not found"; exit 1; }
          SH
