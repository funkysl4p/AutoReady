# OldUnreal UT99 patch used by CI to build AutoReady.
#   newest  = most recent release, including release candidates (e.g. v469f-rc5)
#   stable  = most recent non-RC release
#   <tag>   = a specific tag from github.com/OldUnreal/UnrealTournamentPatches/releases
# Keep it in line with the patch installed on the server.
UT_PATCH=newest
